name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        if: matrix.toolchain == '1.85.0'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.15"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install stable --profile minimal
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python examples/python_api.py
      - run: uv build --wheel --sdist --out-dir dist/ci
      - run: uv run --locked python scripts/check_distributions.py dist/ci
      - run: uv run --locked python scripts/test_wheel.py dist/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/ci/*

  source:
    name: Clean source builds
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal
      - run: cargo package --locked
      - run: uv build --sdist --out-dir dist/source
      - name: Install sdist and test from outside the checkout
        shell: bash
        run: |
          uv venv /tmp/cfop-sdist --python 3.12
          uv pip install --python /tmp/cfop-sdist/bin/python dist/source/*.tar.gz 'pytest>=8.3,<10'
          cd /tmp
          /tmp/cfop-sdist/bin/python -I -m pytest -q "$GITHUB_WORKSPACE/tests/python_smoke.py"

  security:
    name: Dependency and history audits
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings
      - run: uv sync --locked --no-install-project
      - run: uv tool run --from pip-audit pip-audit --path .venv/lib/python3.12/site-packages
      - run: uv run --no-project python scripts/generate_dependency_licenses.py --check
      - name: Scan full Git history without exposing matches
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
