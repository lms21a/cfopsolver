[package]
name = "cfop-solver"
version = "0.3.1"
edition = "2021"
rust-version = "1.70"
description = "Fast, traceable Rubik's Cube solving and CFOP data generation"
license = "MIT"

[lib]
name = "cfop_solver"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cfop"
path = "src/bin/cfop.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.20.3", optional = true, features = ["extension-module", "abi3-py38"] }
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rayon = "=1.10.0"
rcuber = { version = "=0.7.20", path = "vendor/rcuber", default-features = false }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
thiserror = "=1.0.61"

[dev-dependencies]
tempfile = "=3.10.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
