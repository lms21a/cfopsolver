[package]
name = "cfop-solver"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "Fast, traceable Rubik's Cube solving and CFOP data generation"
license = "MIT"
repository = "https://github.com/lms21a/cfopsolver"
readme = "README.md"
keywords = ["rubiks-cube", "cfop", "solver", "python", "training"]
categories = ["algorithms", "science"]
include = [
    "/src/**/*.rs", "/tests/*.rs", "/tests/*.py", "/examples/*.rs", "/examples/*.py", "/scripts/*.py",
    "/Cargo.toml", "/Cargo.lock", "/pyproject.toml", "/uv.lock",
    "/cfop_solver.pyi", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
    "/THIRD_PARTY_DEPENDENCIES.txt", "/rust-toolchain.toml",
    "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/RELEASING.md",
]

[lib]
name = "cfop_solver"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cfop"
path = "src/bin/cfop.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.30.1", optional = true, features = ["extension-module", "abi3-py39"] }
rand = "=0.8.6"
rand_chacha = "=0.3.1"
rayon = "=1.10.0"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
thiserror = "=1.0.61"

[dev-dependencies]
tempfile = "=3.10.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
