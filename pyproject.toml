[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "cfop-solver"
version = "0.1.0"
description = "Fast, traceable Rubik's Cube solving and data generation"
requires-python = ">=3.8"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
features = ["python"]
module-name = "cfop_solver"
include = ["cfop_solver.pyi"]
