[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "cfop-solver"
version = "0.3.2"
description = "Fast, traceable Rubik's Cube solving and data generation"
requires-python = ">=3.8"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[dependency-groups]
dev = [
  "maturin>=1.10,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
required-version = ">=0.6.14"

[tool.maturin]
features = ["python"]
module-name = "cfop_solver"
include = ["cfop_solver.pyi", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["python_*.py", "test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["examples/python_api.py", "tests/python_smoke.py"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
